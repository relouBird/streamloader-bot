name: Initialize test deployment

on:
  workflow_dispatch:

concurrency:
  group: planethoster-bot-test
  cancel-in-progress: false

jobs:
  deploy:
    name: Initialize and deploy test
    runs-on: ubuntu-latest

    steps:
      - name: Initialize test through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 5022 }}
          script_stop: true
          script: |
            set -e

            APP_DIR="$HOME/testbot"
            REPOSITORY="https://github.com/relouBird/streamloader-bot.git"
            BRANCH="test"
            NODE_ENV_ACTIVATE="$HOME/nodevenv/testbot/24/bin/activate"
            ENV_FILE="$APP_DIR/.env"

            if [ ! -f "$NODE_ENV_ACTIVATE" ]; then
              echo "ERROR: Node environment not found: $NODE_ENV_ACTIVATE"
              exit 1
            fi

            # CloudLinux's activation script reads optional unset variables.
            # Load it before enabling Bash nounset for the deployment itself.
            source "$NODE_ENV_ACTIVATE"
            set -u

            if [ ! -d "$APP_DIR" ] || [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: Create $ENV_FILE and $APP_DIR on the server before running this workflow."
              echo "Use a test-specific .env; this workflow never copies local env files or secrets."
              exit 1
            fi

            if [ -d "$APP_DIR/.git" ]; then
              echo "ERROR: Test application is already initialized. Use the test deploy workflow."
              exit 1
            fi

            # Preserve the test .env while refusing to overwrite other app files.
            EXTRA_FILE="$(find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name '.*' -print -quit)"
            if [ -n "$EXTRA_FILE" ]; then
              echo "ERROR: Existing directory contains unexpected files: $EXTRA_FILE"
              exit 1
            fi

            cd "$APP_DIR"
            git init
            git remote add origin "$REPOSITORY"
            git fetch --depth=1 origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"

            npm ci --include=dev
            npm run build
            test -f "$APP_DIR/dist/index.js"

            # Keep documentation in Git but out of the test app directory.
            find "$APP_DIR" -type f -iname '*.md' \
              -not -path "$APP_DIR/.git/*" \
              -print -delete

            /usr/sbin/cloudlinux-selector restart \
              --json \
              --interpreter=nodejs \
              --app-root="$APP_DIR"

            echo "First test deployment successful."
