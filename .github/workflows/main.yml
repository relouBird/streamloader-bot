name: Deploy to Shared Hosting[PlanetHoster]

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: planethoster-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy through SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 5022

          script: |
            set -e

            # Configuration
            APP_DIR="$HOME/test-api"
            REPOSITORY="https://github.com/relouBird/streamloader-bot.git"
            NODE_ENV_ACTIVATE="$HOME/nodevenv/test-api/22/bin/activate"

            # Clone or update repository
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"

              if [ -n "$(ls -A "$APP_DIR")" ]; then
                echo "ERROR: Directory is not empty."
                exit 1
              fi

              git clone -b main "$REPOSITORY" "$APP_DIR"
            else
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Activate Node.js environment
            source "$NODE_ENV_ACTIVATE"

            cd "$APP_DIR"

            # Install dependencies, including development dependencies
            npm ci --include=dev

            # Verify TypeScript
            npx tsc --version


            # Build
            npm run build

            # Verify build
            test -f "$APP_DIR/dist/index.js"

            # Restart application
            /usr/sbin/cloudlinux-selector restart \
              --json \
              --interpreter=nodejs \
              --app-root="$APP_DIR"

            echo "Deployment successful!"
